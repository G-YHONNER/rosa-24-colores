<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>YHONNER</title>

  <script>
    // Bloqueo estricto de zoom en pantalla del control remoto
    document.addEventListener("touchstart", function (e) {
      if (e.touches.length > 1) { e.preventDefault(); }
    }, { passive: false });
    document.addEventListener("touchmove", function (e) {
      if (e.touches.length > 1) { e.preventDefault(); }
    }, { passive: false });
    var lastTap = 0;
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      if (now - lastTap <= 300) {
        if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
          e.preventDefault();
        }
      }
      lastTap = now;
    }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gestureend", function (e) { e.preventDefault(); }, { passive: false });
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: radial-gradient(ellipse at 50% 25%, #131c36 0%, #070e1e 60%, #02050c 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 45px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Encabezado */
    .remote-header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffb300;
      box-shadow: 0 0 6px #ffb300;
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .status-dot.disconnected {
      background: #ff5252;
      box-shadow: 0 0 8px #ff5252;
    }

    /* Contenido Principal */
    .remote-content {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .section-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Cuadrícula de colores táctiles */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .color-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      text-align: left;
    }

    .color-card:active {
      transform: scale(0.95);
    }

    .color-card.active {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 16px var(--card-glow, rgba(255, 255, 255, 0.4));
    }

    .card-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .card-desc {
      font-size: 0.72rem;
      opacity: 0.7;
      white-space: nowrap;
    }

    /* Swatches */
    .swatch-blue    { background: linear-gradient(135deg, #0084ff, #0d52ba); }
    .swatch-pink      { background: linear-gradient(135deg, #ffb8cb, #911f46); }
    .swatch-purple  { background: linear-gradient(135deg, #ce93d8, #4a0e4e); }
    .swatch-ruby    { background: linear-gradient(135deg, #ff4081, #5e081c); }
    .swatch-gold    { background: linear-gradient(135deg, #ffe082, #663d00); }
    .swatch-cyan    { background: linear-gradient(135deg, #84ffff, #004d40); }
    .swatch-red     { background: linear-gradient(135deg, #ff1744, #8a0000); }
    .swatch-emerald { background: linear-gradient(135deg, #00e676, #006020); }
    .swatch-orange  { background: linear-gradient(135deg, #ff9100, #bf360c); }
    .swatch-white   { background: linear-gradient(135deg, #ffffff, #90a4ae); }
    .swatch-black   { background: linear-gradient(135deg, #424242, #111111); }
    .swatch-coral     { background: linear-gradient(135deg, #ff6e40, #d84315); }
    .swatch-lavender  { background: linear-gradient(135deg, #b388ff, #512da8); }
    .swatch-mint      { background: linear-gradient(135deg, #1de9b6, #004d40); }
    .swatch-yellow    { background: linear-gradient(135deg, #ffea00, #ff8f00); }
    .swatch-magenta   { background: linear-gradient(135deg, #ff007f, #880e4f); }
    .swatch-turquoise { background: linear-gradient(135deg, #00e5ff, #01579b); }
    .swatch-lime      { background: linear-gradient(135deg, #76ff03, #33691e); }
    .swatch-peach     { background: linear-gradient(135deg, #ffab91, #d84315); }
    .swatch-indigo    { background: linear-gradient(135deg, #536dfe, #1a237e); }
    .swatch-bronze    { background: linear-gradient(135deg, #d77a38, #5c2406); }
    .swatch-crimson   { background: linear-gradient(135deg, #ad1457, #3e0422); }
    .swatch-silver    { background: linear-gradient(135deg, #e0e0e0, #424242); }
    .swatch-champagne { background: linear-gradient(135deg, #f7e7ce, #8c7322); }

    .card-blue      { --card-glow: rgba(0, 162, 255, 0.6); }
    .card-pink      { --card-glow: rgba(244, 162, 184, 0.6); }
    .card-purple    { --card-glow: rgba(206, 147, 216, 0.6); }
    .card-ruby      { --card-glow: rgba(255, 64, 129, 0.6); }
    .card-gold      { --card-glow: rgba(255, 224, 130, 0.6); }
    .card-cyan      { --card-glow: rgba(132, 255, 255, 0.6); }
    .card-red       { --card-glow: rgba(255, 23, 68, 0.6); }
    .card-emerald   { --card-glow: rgba(0, 230, 118, 0.6); }
    .card-orange    { --card-glow: rgba(255, 145, 0, 0.6); }
    .card-white     { --card-glow: rgba(255, 255, 255, 0.7); }
    .card-black     { --card-glow: rgba(186, 104, 200, 0.6); }
    .card-coral     { --card-glow: rgba(255, 110, 64, 0.6); }
    .card-lavender  { --card-glow: rgba(179, 136, 255, 0.6); }
    .card-mint      { --card-glow: rgba(29, 233, 182, 0.6); }
    .card-yellow    { --card-glow: rgba(255, 234, 0, 0.6); }
    .card-magenta   { --card-glow: rgba(255, 0, 127, 0.6); }
    .card-turquoise { --card-glow: rgba(0, 229, 255, 0.6); }
    .card-lime      { --card-glow: rgba(118, 255, 3, 0.6); }
    .card-peach     { --card-glow: rgba(255, 171, 145, 0.6); }
    .card-indigo    { --card-glow: rgba(83, 109, 254, 0.6); }
    .card-bronze    { --card-glow: rgba(215, 122, 56, 0.6); }
    .card-crimson   { --card-glow: rgba(194, 24, 91, 0.6); }
    .card-silver    { --card-glow: rgba(224, 224, 224, 0.7); }
    .card-champagne { --card-glow: rgba(212, 175, 55, 0.6); }

    /* Acciones rápidas (Destellos / Auto Ciclo) */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.86rem;
      font-weight: 600;
      text-align: center;
    }

    .action-card.full-width {
      grid-column: span 2;
      flex-direction: row;
      gap: 10px;
      padding: 14px 16px;
      font-size: 0.92rem;
      background: rgba(255, 213, 79, 0.1);
      border-color: rgba(255, 213, 79, 0.3);
    }

    .action-card .icon {
      font-size: 1.4rem;
    }

    .action-card:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.2);
    }

    .action-card.active {
      border-color: #00e676;
      background: rgba(0, 230, 118, 0.2);
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
    }

    /* Dedicatoria personalizada */
    .dedication-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .current-phrase-preview {
      font-size: 0.78rem;
      opacity: 0.75;
      padding: 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-phrase-preview strong {
      color: #ffd54f;
    }

    .dedication-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .dedication-input:focus {
      border-color: #80d8ff;
      box-shadow: 0 0 8px rgba(128, 216, 255, 0.4);
    }

    .dedication-buttons {
      display: flex;
      gap: 8px;
    }

    .send-btn {
      flex: 1;
      background: linear-gradient(135deg, #0084ff, #0d52ba);
      border: none;
      color: #ffffff;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .send-btn:active {
      transform: scale(0.97);
    }

    .reset-text-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 12px;
      width: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .reset-text-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 230, 118, 0.95);
      color: #02050c;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>

    <section>

          Frase actual: <em>(Ninguna)</em>

  </main>

  <div class="toast" id="toast">Cambiado con éxito</div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const TOPIC = "yhonner/rose/yhonner-rosa-magica";
      const RELAY_TOPIC = "yhonner_rose_magic_remote_9482";
      const RELAY_URL = "https://ntfy.sh/" + RELAY_TOPIC;
      const RELAY_SSE = "https://ntfy.sh/" + RELAY_TOPIC + "/sse";

      const BROKERS = [
        "wss://broker.hivemq.com:8884/mqtt",
        "wss://broker.emqx.io:8084/mqtt"
      ];
      let currentBroker = 0;
      let mqttClient = null;
      let isMqttConnected = false;
      let isRelayConnected = false;
      let isConnectingMqtt = false;
      let cmdSeq = 0;

      // Estado persistente del control
      let activeColor = localStorage.getItem("remote_active_color") || "blue";
      let activePhrase = localStorage.getItem("remote_active_phrase") || "";
      let activeCycleInterval = parseInt(localStorage.getItem("remote_active_cycle") || "0", 10);

      let isMinuteCycling = (activeCycleInterval === 60000);
      let isFastCycling = (activeCycleInterval === 4000);

      const bc = window.BroadcastChannel ? new BroadcastChannel("rose_channel_yhonner-rosa-magica") : null;

      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const statusBadge = document.getElementById("statusBadge");
      const toastEl = document.getElementById("toast");
      const colorCards = document.querySelectorAll(".color-card");
      const sparkleBtn = document.getElementById("sparkleBtn");
      const cycleMinuteBtn = document.getElementById("cycleMinuteBtn");
      const cycleFastBtn = document.getElementById("cycleFastBtn");
      const dedicationInput = document.getElementById("dedicationInput");
      const sendDedicationBtn = document.getElementById("sendDedicationBtn");
      const resetTextBtn = document.getElementById("resetTextBtn");
      const currentPhrasePreview = document.getElementById("currentPhrasePreview");

      // Restaurar estado visual inicial del control
      updateActiveCard(activeColor);
      updatePreviewText(activePhrase);
      if (cycleMinuteBtn) cycleMinuteBtn.classList.toggle("active", isMinuteCycling);
      if (cycleFastBtn) cycleFastBtn.classList.toggle("active", isFastCycling);

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        setTimeout(function () {
          toastEl.classList.remove("show");
        }, 2500);
      }

      function vibrate() {
        if (navigator.vibrate) {
          try { navigator.vibrate(25); } catch (e) {}
        }
      }

      function updateOverallStatus() {
        if (isRelayConnected || isMqttConnected) {
          setStatus(true, "En línea 🟢");
        } else {
          setStatus(false, "Conectando...");
        }
      }

      function setStatus(connected, text) {
        if (statusDot && statusText) {
          statusDot.className = "status-dot " + (connected ? "connected" : "disconnected");
          statusText.textContent = text || (connected ? "En línea 🟢" : "Desconectado");
        }
      }

      function updatePreviewText(text) {
        if (currentPhrasePreview) {
          if (text && text.trim()) {
            currentPhrasePreview.innerHTML = "Frase en pantalla: <strong>\"" + text.trim() + "\"</strong>";
          } else {
            currentPhrasePreview.innerHTML = "Frase actual: <em>(Ninguna)</em>";
          }
        }
      }

      // Envío multi-transporte garantizado: HTTPS Puerto 443 + MQTT + BroadcastChannel
      function sendCommand(data) {
        vibrate();
        cmdSeq++;
        data.cmdId = "c_" + Date.now() + "_" + cmdSeq;
        data.sender = "remote";

        // 1. Envío instantáneo por HTTPS Puerto 443 (Garantizado en 4G/5G y redes móviles)
        try {
          fetch(RELAY_URL, {
            method: "POST",
            body: JSON.stringify(data),
            headers: { "Content-Type": "application/json" }
          }).catch(function () {});
        } catch (e) {}

        // 2. Envío por MQTT (si está disponible)
        if (mqttClient && isMqttConnected) {
          try {
            const msg = new Paho.MQTT.Message(JSON.stringify(data));
            msg.destinationName = TOPIC;
            mqttClient.send(msg);
          } catch (e) {}
        }

        // 3. Envío por BroadcastChannel (mismo navegador / PC)
        if (bc) {
          try { bc.postMessage(data); } catch (e) {}
        }
      }

      // Emite el estado actual a todas las rosas (abiertas o recién abiertas)
      function broadcastCurrentState() {
        sendCommand({
          type: "sync_state",
          color: activeColor,
          phrase: activePhrase,
          cycleInterval: isMinuteCycling ? 60000 : (isFastCycling ? 4000 : 0)
        });
      }

      function handleFeedback(data) {
        if (!data || data.sender === "remote") return;
        // Cuando cualquier rosa abre o pide sincronización, le respondemos con el estado actual
        if (data.type === "request_sync" || data.type === "rose_hello" || data.type === "remote_ping") {
          broadcastCurrentState();
        }
      }

      // Canal 1: HTTPS SSE Relay (Puerto 443)
      let sseRelay = null;
      function connectRelaySSE() {
        if (typeof EventSource === "undefined") {
          isRelayConnected = true; // El envío HTTP POST sigue funcionando siempre
          updateOverallStatus();
          return;
        }
        try {
          if (sseRelay) sseRelay.close();
          sseRelay = new EventSource(RELAY_SSE);
          sseRelay.onopen = function () {
            isRelayConnected = true;
            updateOverallStatus();
            // Solicitar sincronización de estado de la pantalla
            sendCommand({ type: "remote_ping" });
          };
          sseRelay.onmessage = function (event) {
            try {
              const raw = JSON.parse(event.data);
              if (raw && raw.message) {
                const data = typeof raw.message === "string" ? JSON.parse(raw.message) : raw.message;
                handleFeedback(data);
              }
            } catch (e) {}
          };
          sseRelay.onerror = function () {
            // El navegador reconecta automáticamente
            if (!isMqttConnected) {
              // Si aún podemos hacer HTTP POST, mantenemos el control activo
              isRelayConnected = false;
              updateOverallStatus();
            }
          };
        } catch (e) {}
      }

      // Canal 2: Paho MQTT como respaldo
      function connectMQTT() {
        if (typeof Paho === "undefined") return;
        if (isConnectingMqtt) return;
        isConnectingMqtt = true;

        const brokerUri = BROKERS[currentBroker];
        const clientId = "rem_" + Math.random().toString(16).substring(2, 8);
        try {
          mqttClient = new Paho.MQTT.Client(brokerUri, clientId);
        } catch (e) {
          isConnectingMqtt = false;
          currentBroker = (currentBroker + 1) % BROKERS.length;
          setTimeout(connectMQTT, 2000);
          return;
        }

        mqttClient.onConnectionLost = function () {
          isMqttConnected = false;
          isConnectingMqtt = false;
          updateOverallStatus();
          currentBroker = (currentBroker + 1) % BROKERS.length;
          setTimeout(connectMQTT, 2500);
        };

        mqttClient.onMessageArrived = function (msg) {
          try {
            const data = JSON.parse(msg.payloadString);
            handleFeedback(data);
          } catch (e) {}
        };

        mqttClient.connect({
          useSSL: true,
          timeout: 6,
          keepAliveInterval: 30,
          cleanSession: true,
          onSuccess: function () {
            isMqttConnected = true;
            isConnectingMqtt = false;
            updateOverallStatus();
            try {
              mqttClient.subscribe(TOPIC);
              sendCommand({ type: "remote_ping" });
            } catch (e) {}
          },
          onFailure: function () {
            isMqttConnected = false;
            isConnectingMqtt = false;
            updateOverallStatus();
            currentBroker = (currentBroker + 1) % BROKERS.length;
            setTimeout(connectMQTT, 2000);
          }
        });
      }

      // Iniciar ambos canales
      connectRelaySSE();
      connectMQTT();

      if (statusBadge) {
        statusBadge.addEventListener("click", function () {
          connectRelaySSE();
          if (!isMqttConnected) connectMQTT();
          showToast("Reconectando...");
        });
      }

      if (bc) {
        bc.onmessage = function (event) {
          handleFeedback(event.data);
        };
      }

      function updateActiveCard(color) {
        colorCards.forEach(function (c) {
          c.classList.toggle("active", c.getAttribute("data-color") === color);
        });
      }

      // 1. Cambiar color manual
      colorCards.forEach(function (card) {
        card.addEventListener("click", function () {
          const color = card.getAttribute("data-color");
          const colorName = card.querySelector(".card-title") ? card.querySelector(".card-title").textContent : color;

          activeColor = color;
          try { localStorage.setItem("remote_active_color", color); } catch (e) {}
          updateActiveCard(color);

          // Si había un ciclo activo, desactivarlo
          if (isMinuteCycling || isFastCycling) {
            isMinuteCycling = false;
            isFastCycling = false;
            try { localStorage.setItem("remote_active_cycle", "0"); } catch (e) {}
            cycleMinuteBtn.classList.remove("active");
            cycleFastBtn.classList.remove("active");
          }

          broadcastCurrentState();
          showToast("Color: " + colorName + " ✨");
        });
      });

      // 2. CICLO CADA MINUTO (60 Segundos)
      if (cycleMinuteBtn) {
        cycleMinuteBtn.addEventListener("click", function () {
          isMinuteCycling = !isMinuteCycling;
          if (isMinuteCycling) {
            isFastCycling = false;
            cycleFastBtn.classList.remove("active");
          }
          cycleMinuteBtn.classList.toggle("active", isMinuteCycling);
          try { localStorage.setItem("remote_active_cycle", isMinuteCycling ? "60000" : "0"); } catch (e) {}

          broadcastCurrentState();
          showToast(isMinuteCycling ? "⏱️ Cambio automático cada 1 minuto activado" : "⏱️ Cambio cada minuto detenido");
        });
      }

      // 3. CICLO RÁPIDO (4 Segundos)
      if (cycleFastBtn) {
        cycleFastBtn.addEventListener("click", function () {
          isFastCycling = !isFastCycling;
          if (isFastCycling) {
            isMinuteCycling = false;
            cycleMinuteBtn.classList.remove("active");
          }
          cycleFastBtn.classList.toggle("active", isFastCycling);
          try { localStorage.setItem("remote_active_cycle", isFastCycling ? "4000" : "0"); } catch (e) {}

          broadcastCurrentState();
          showToast(isFastCycling ? "🔄 Ciclo rápido activado (4s)" : "🔄 Ciclo rápido detenido");
        });
      }

      // 4. Lluvia de Brillos
      if (sparkleBtn) {
        sparkleBtn.addEventListener("click", function () {
          sendCommand({ type: "sparkle" });
          showToast("¡Lluvia de brillos enviada! ✨");
        });
      }

      // 5. FIJAR FRASE PERMANENTE
      if (sendDedicationBtn && dedicationInput) {
        function sendDedication() {
          const text = dedicationInput.value.trim();
          if (!text) return;
          activePhrase = text;
          try { localStorage.setItem("remote_active_phrase", text); } catch (e) {}
          updatePreviewText(text);
          broadcastCurrentState();
          showToast("📌 Frase fijada de forma permanente");
          dedicationInput.value = "";
          dedicationInput.blur();
        }

        sendDedicationBtn.addEventListener("click", sendDedication);
        dedicationInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") sendDedication();
        });
      }

      // 6. BORRAR FRASE DE LA PANTALLA
      if (resetTextBtn) {
        resetTextBtn.addEventListener("click", function () {
          activePhrase = "";
          try { localStorage.removeItem("remote_active_phrase"); } catch (e) {}
          updatePreviewText("");
          broadcastCurrentState();
          showToast("🗑️ Frase eliminada de la pantalla");
        });
      }

      // 7. LATIDO PERIÓDICO DE SINCRONIZACIÓN AUTOMÁTICA
      // Sincroniza de inmediato cualquier nueva pestaña que se abra en 2 o 3 pantallas
      setInterval(function () {
        if (isRelayConnected || isMqttConnected) {
          broadcastCurrentState();
        }
      }, 6000);
    });
  </script>
